<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>성운고등학교</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ff; --surface:#ffffff; --ink:#1c1e52; --muted:#5f6194; --line:#ddd6fb;
  --purple:#6f4cf0; --accent-text:#5638d0; --lilac:#e8e1ff;
  --c0:#ece6ff; --c1:#e2e8ff; --c2:#f1e4ff;
  --font-head:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d0f2e; --surface:#171a49; --ink:#ece9ff; --muted:#b0aedd; --line:#2d3182;
    --purple:#8467ff; --accent-text:#c6b6ff; --lilac:#2a2578;
    --c0:#211f5f; --c1:#1b2260; --c2:#2a1f5e;
  }
}
:root[data-theme="dark"]{
  --bg:#0d0f2e; --surface:#171a49; --ink:#ece9ff; --muted:#b0aedd; --line:#2d3182;
  --purple:#8467ff; --accent-text:#c6b6ff; --lilac:#2a2578;
  --c0:#211f5f; --c1:#1b2260; --c2:#2a1f5e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.65;font-size:16px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:400;margin:0}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
[hidden]{display:none!important}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;color:#fff;
  background:linear-gradient(100deg,#12154a,#2c2a94 70%,#4b33b8);box-shadow:0 2px 14px rgba(18,21,74,.35)}
.top .wrap{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding-top:10px;padding-bottom:10px}
.brand{order:1;display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;color:#fff;
  font-family:var(--font-head);font-size:1.3rem;padding:2px 0}
.brand .spark{color:#cdbcff}
.auth{order:2;margin-left:auto;display:flex;align-items:center;gap:8px}
.tabs{order:3;width:100%;display:flex;gap:6px}
.tab{flex:1;border:0;cursor:pointer;color:#e9e4ff;background:rgba(255,255,255,.12);border-radius:999px;
  padding:7px 8px;font-family:var(--font-head);font-size:.98rem;white-space:nowrap}
.tab[aria-current="page"]{background:#fff;color:#2c2a94}
.who{font-size:.9rem;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;max-width:44vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:720px){
  .tabs{order:2;width:auto;margin-left:14px}
  .tab{flex:none;padding:7px 16px}
  .auth{order:3}
}

/* buttons & inputs */
.btn{border:0;cursor:pointer;border-radius:999px;padding:10px 20px;font-family:var(--font-head);font-size:1rem}
.btn.primary{background:var(--purple);color:#fff}
.btn.light{background:#fff;color:#2c2a94}
.btn.ghost{background:rgba(255,255,255,.16);color:#fff}
.btn.soft{background:var(--lilac);color:var(--accent-text)}
.btn.small{padding:6px 14px;font-size:.9rem}
.btn.wide{width:100%}
.btn:hover{filter:brightness(1.06)}
.in{width:100%;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.in:focus{border-color:var(--purple);outline:none}
textarea.in{resize:vertical;min-height:88px}
.field{display:block;margin-top:12px}
.field>span{display:block;font-size:.92rem;color:var(--muted);margin-bottom:4px}
.err{color:#d6336c;font-size:.92rem;min-height:1.4em;margin:8px 0 0}
:root[data-theme="dark"] .err{color:#ff8fb7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8fb7}}

/* hero */
.hero{margin-top:18px;border-radius:28px;color:#fff;padding:34px 26px 30px;position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 88% 18%,rgba(196,166,255,.6),transparent 40%),
    radial-gradient(circle at 8% 95%,rgba(90,112,255,.5),transparent 46%),
    linear-gradient(135deg,#141760,#3a2a9c 58%,#6a49e6)}
.hero h1{font-size:clamp(2.1rem,8vw,3.2rem);line-height:1.15;position:relative}
.hero p{margin:10px 0 20px;max-width:30ch;color:#ece7ff;font-size:1.08rem;position:relative}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;position:relative}
.star{position:absolute;color:#e6dcff;animation:twinkle 3.2s ease-in-out infinite;pointer-events:none}
.s1{top:18px;right:34px;font-size:2.2rem}
.s2{top:84px;right:96px;font-size:1rem;animation-delay:1s}
.s3{bottom:26px;right:44px;font-size:1.4rem;animation-delay:2s}
@keyframes twinkle{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}

/* home cards */
.grid{display:grid;gap:14px;margin-top:14px;grid-template-columns:1fr}
@media (min-width:720px){.grid{grid-template-columns:1.6fr 1fr}.grid .wideCard{grid-column:1/-1}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:18px 20px}
.card h3{font-size:1.2rem;color:var(--accent-text)}
.card p{margin:6px 0 12px;color:var(--muted)}
.peek{background:var(--c0);border-radius:16px;padding:10px 14px;margin:10px 0 14px;font-size:.96rem}
.peek b{font-family:var(--font-head);font-weight:400;color:var(--accent-text)}
.big{font-family:var(--font-head);font-size:1.7rem;color:var(--ink);margin-top:6px}
.dday{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:2px 12px;font-family:var(--font-head);font-size:.95rem;margin-left:6px;vertical-align:middle}
.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.strip p{margin:0}

/* sections */
.page-head{margin:22px 0 4px}
.page-head h2{font-size:1.6rem}
.page-head p{margin:4px 0 0;color:var(--muted)}
.seg{display:inline-flex;gap:4px;background:var(--lilac);border-radius:999px;padding:4px;margin:14px 0 4px;flex-wrap:wrap}
.seg-b{border:0;background:transparent;cursor:pointer;padding:8px 16px;border-radius:999px;font-family:var(--font-head);color:var(--ink)}
.seg-b[aria-selected="true"]{background:var(--purple);color:#fff}

/* letters */
.letter{background:var(--c0);border:2px solid var(--line);border-radius:22px;padding:14px 18px;margin-top:12px}
.letter.c1{background:var(--c1)}
.letter.c2{background:var(--c2)}
.letter .to{font-family:var(--font-head);color:var(--accent-text);font-size:1.08rem}
.letter .body{margin:4px 0 10px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:.9rem;color:var(--muted)}
.meta .from{color:var(--ink);font-weight:700}
.meta .sp{flex:1}
.link{background:none;border:0;cursor:pointer;color:var(--accent-text);padding:2px 4px;border-radius:8px;text-decoration:underline;text-underline-offset:3px}
.replies{margin-top:12px;border-top:2px dashed var(--line);padding-top:10px}
.bubble{background:var(--surface);border-radius:16px 16px 16px 4px;padding:8px 12px;margin-bottom:8px;border:1px solid var(--line)}
.bubble .body{margin:0 0 2px;white-space:pre-wrap;word-break:break-word}
.reply-form{display:grid;gap:8px;margin-top:8px}
.composer{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px 18px;margin-top:12px}
.picks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pick{flex:1;min-width:140px;position:relative;border:2px solid var(--line);border-radius:14px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.pick input{position:absolute;opacity:0;inset:0;cursor:pointer}
.pick span{display:flex;flex-direction:column;line-height:1.3}
.pick small{color:var(--muted)}
.pick:has(input:checked){border-color:var(--purple);background:var(--lilac)}
.pick:has(input:focus-visible){outline:3px solid var(--purple);outline-offset:2px}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.gate{text-align:center;padding:28px 20px}
.gate .lock{font-size:2.2rem}
.gate p{color:var(--muted);max-width:36ch;margin:6px auto 14px}
.more{display:block;margin:16px auto 0}

/* rules */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-family:var(--font-head);font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:#fff}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rule{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:11px 14px}
.rule .no{flex:none;min-width:58px;text-align:center;background:var(--lilac);color:var(--accent-text);border-radius:999px;padding:1px 10px;font-family:var(--font-head);font-size:.95rem}
.rule .cat{display:block;font-size:.82rem;color:var(--muted)}
.rule p{margin:0}

/* dialog + toast */
dialog{border:0;border-radius:26px;padding:20px;width:min(420px,92vw);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,12,50,.5)}
dialog::backdrop{background:rgba(12,14,50,.65)}
.dlg-head{display:flex;align-items:center;justify-content:space-between}
.dlg-head h2{font-size:1.3rem}
.x{border:0;background:var(--lilac);border-radius:999px;width:34px;height:34px;cursor:pointer;color:var(--ink)}
.nick{margin:12px 0 0;background:var(--c0);border-radius:14px;padding:8px 12px;font-size:.95rem}
.nick b{color:var(--accent-text)}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;
  background:#1c1e52;color:#fff;border-radius:999px;padding:10px 20px;font-size:.95rem;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:90vw;text-align:center}
footer{margin:34px 0 26px;text-align:center;color:var(--muted);font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <button class="brand" id="brand" aria-label="성운고등학교 홈"><span class="spark">✦</span>성운고등학교</button>
    <nav class="tabs" aria-label="메뉴">
      <button class="tab" data-view="home">홈</button>
      <button class="tab" data-view="msg">대신전해드립니다</button>
      <button class="tab" data-view="rules">교칙</button>
    </nav>
    <div class="auth" id="auth-area"></div>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1"></main>
<footer class="wrap">성운고등학교 · 가상의 학교 사이트예요</footer>

<dialog id="authDlg" aria-labelledby="authTitle">
  <div class="dlg-head">
    <h2 id="authTitle">성운고등학교 계정</h2>
    <button class="x" id="authClose" aria-label="닫기">✕</button>
  </div>
  <div class="seg" role="tablist">
    <button class="seg-b" id="tabLogin" role="tab" aria-selected="true">로그인</button>
    <button class="seg-b" id="tabSignup" role="tab" aria-selected="false">회원가입</button>
  </div>

  <div id="loginPane">
    <label class="field"><span>학번 (교직원은 “교직원”)</span><input class="in" id="li-id" autocomplete="off" placeholder="예: 1109"></label>
    <label class="field"><span>이름</span><input class="in" id="li-name" autocomplete="off" placeholder="예: 차하연"></label>
    <label class="field"><span>비밀번호</span><input class="in" id="li-pw" type="password" autocomplete="current-password"></label>
    <p class="err" id="liErr" role="alert"></p>
    <button class="btn primary wide" id="doLogin">로그인</button>
  </div>

  <div id="signupPane" hidden>
    <label class="field"><span>학번 (교직원은 “교직원”)</span><input class="in" id="su-id" autocomplete="off" placeholder="예: 1109 (1학년 1반 9번)"></label>
    <label class="field"><span>이름</span><input class="in" id="su-name" autocomplete="off" placeholder="예: 차하연"></label>
    <p class="nick">내 닉네임: <b id="nickPrev">학번과 이름을 적어 주세요</b></p>
    <label class="field" id="codeField" hidden><span>교직원 인증코드</span><input class="in" id="su-code" autocomplete="off"></label>
    <label class="field"><span>비밀번호 (4자 이상)</span><input class="in" id="su-pw" type="password" autocomplete="new-password"></label>
    <label class="field"><span>비밀번호 확인</span><input class="in" id="su-pw2" type="password" autocomplete="new-password"></label>
    <p class="err" id="suErr" role="alert"></p>
    <button class="btn primary wide" id="doSignup">가입하기</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return '방금 전';
  if (s < 3600) return Math.floor(s / 60) + '분 전';
  if (s < 86400) return Math.floor(s / 3600) + '시간 전';
  return Math.floor(s / 86400) + '일 전';
}
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}

/* ---------- 서버 통신 ---------- */
let memTk = null;
const getToken = () => { try { return localStorage.getItem('sw_token'); } catch (e) { return memTk; } };
const setToken = t => { memTk = t; try { t ? localStorage.setItem('sw_token', t) : localStorage.removeItem('sw_token'); } catch (e) {} };
async function api(method, url, body) {
  const headers = { 'Content-Type': 'application/json' }, tk = getToken();
  if (tk) headers.Authorization = 'Bearer ' + tk;
  let res;
  try { res = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const err = new Error('서버에 연결할 수 없어요. 잠시 뒤 다시 해 주세요.'); err.status = 0; throw err; }
  let data = {}; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || '문제가 생겼어요. 잠시 뒤 다시 해 주세요.'); err.status = res.status; throw err; }
  return data;
}

/* ---------- state ---------- */
const state = { view: 'home', board: 'student', user: null, config: { staffCodeRequired: false },
  posts: { student: undefined, staff: undefined }, loadErr: null,
  shown: { student: 5, staff: 5 }, composing: {}, draft: {}, rdraft: {}, open: {}, delAsk: null, ruleCat: '전체' };
function go(v) { state.view = v; render(); window.scrollTo(0, 0); refresh(false); }
const isTyping = () => { const a = document.activeElement; return !!a && $('#main').contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName); };

async function loadPosts(board, silent) {
  if (board === 'staff' && !(state.user && state.user.staff)) return;
  try {
    const d = await api('GET', '/api/posts?board=' + board);
    const changed = JSON.stringify(d.posts) !== JSON.stringify(state.posts[board]);
    state.posts[board] = d.posts; state.loadErr = null;
    if (silent ? (changed && !isTyping()) : true) render();
  } catch (e) {
    if (e.status === 401 || e.status === 403) return;
    state.loadErr = e.message; if (!silent) render();
  }
}
function refresh(silent) {
  if (state.view === 'rules') return;
  return loadPosts(state.view === 'msg' ? state.board : 'student', silent);
}
function forgetSession() { setToken(null); state.user = null; state.posts.staff = undefined; }
function handleErr(e) {
  if (e.status === 401) { forgetSession(); render(); openAuth('login'); toast('로그인이 필요해요'); }
  else toast(e.message);
}

/* ---------- 사복데이 계산 ---------- */
function nextCasualDay() {
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate()), c = [];
  for (let i = 0; i < 3; i++) {
    const y = today.getFullYear(), m = today.getMonth() + i;
    const first = new Date(y, m, 1);
    c.push(new Date(y, m, 1 + (3 - first.getDay() + 7) % 7 + 7));          // 둘째 주 수요일
    const last = new Date(y, m + 1, 0);
    c.push(new Date(y, m + 1, 0 - (last.getDay() - 5 + 7) % 7));           // 마지막 주 금요일
  }
  const d = c.filter(x => x >= today).sort((a, b) => a - b)[0];
  return { date: d, diff: Math.round((d - today) / 86400000) };
}

/* ---------- header ---------- */
function renderHeader() {
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.view === state.view) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  const u = state.user, area = $('#auth-area');
  area.replaceChildren();
  if (u) {
    area.append(h('span', { class: 'who', title: u.nick }, u.nick + ' 님'),
      h('button', { class: 'btn light small', onclick: logout }, '로그아웃'));
  } else {
    area.append(h('button', { class: 'btn light small', onclick: () => openAuth('login') }, '로그인'));
  }
}

/* ---------- views ---------- */
function homeView() {
  const cd = nextCasualDay(), days = ['일', '월', '화', '수', '목', '금', '토'];
  const latest = (state.posts.student || [])[0];
  const dd = cd.diff === 0 ? '오늘!' : 'D-' + cd.diff;
  return h('div', {},
    h('section', { class: 'hero' },
      h('span', { class: 'star s1', 'aria-hidden': 'true' }, '✦'),
      h('span', { class: 'star s2', 'aria-hidden': 'true' }, '✦'),
      h('span', { class: 'star s3', 'aria-hidden': 'true' }, '✦'),
      h('h1', {}, '성운고등학교'),
      h('p', {}, '말하기 어려운 마음은 성운이 대신 전해드려요.'),
      h('div', { class: 'hero-actions' },
        h('button', { class: 'btn light', onclick: () => go('msg') }, '✉️ 메시지 쓰기'),
        h('button', { class: 'btn ghost', onclick: () => go('rules') }, '교칙 보기'))),
    h('div', { class: 'grid' },
      h('section', { class: 'card' },
        h('h3', {}, '대신전해드립니다'),
        h('p', {}, '익명으로도, 학번·이름으로도 마음을 전할 수 있어요.'),
        latest ? h('div', { class: 'peek' }, h('b', {}, 'To. ' + latest.to), h('br'), latest.text.length > 46 ? latest.text.slice(0, 46) + '…' : latest.text) : null,
        h('button', { class: 'btn primary small', onclick: () => go('msg') }, '게시판 열기')),
      h('section', { class: 'card' },
        h('h3', {}, '다음 사복데이'),
        h('div', { class: 'big' }, `${cd.date.getMonth() + 1}월 ${cd.date.getDate()}일 (${days[cd.date.getDay()]})`, h('span', { class: 'dday' }, dd)),
        h('p', {}, '매월 둘째 주 수요일, 마지막 주 금요일')),
      h('section', { class: 'card wideCard strip' },
        h('div', {}, h('h3', {}, '교칙'), h('p', {}, '복장 · 두발·외모 · 동아리 · 학교생활, 항목별로 모아뒀어요.')),
        h('button', { class: 'btn soft', onclick: () => go('rules') }, '교칙 보러 가기'))));
}

const RULES = [
  { n: 1, c: '복장', t: '남자는 넥타이, 여자는 리본 기본 착용 또는 남자 리본, 여자 넥타이. (빨간색이랑 검정색만 착용.)' },
  { n: 2, c: '복장', t: '사복과 교복을 임의로 변형하지 않는다. (단, 자켓이나 가디건, 후드티 등은 허용, 체육 없는 날에도 체육복 허용)' },
  { n: 3, c: '두발·외모', t: '학생의 두발 형태는 자유로우나, 수업과 학교 생활에 지장 없도록 관리한다.' },
  { n: 4, c: '두발·외모', t: '화장은 지나치게 진하지 않은 범위에서 허용한다.' },
  { n: 5, c: '복장', t: '동복 자켓에는 학교의 은색 교표 배지를 부착한다.' },
  { n: 6, c: '복장', t: '교복에 이름표를 부착하며, 이름표는 학년별로 테두리 색이 다르다.' },
  { n: 7, c: '동아리', t: '동아리는 학술·예술·체육·봉사·문화 등으로 구분한다.' },
  { n: 8, c: '동아리', t: '학생이 직접 새로운 동아리를 창설할 경우, 최소 8명의 회원을 확보해야 한다.' },
  { n: 9, c: '학교생활', t: "매월 둘째 주 수요일, 마지막 주 금요일은 '사복데이'로 지정한다." },
  { n: 10, c: '학교생활', t: '학년마다 학교 생활을 상징하는 학년 문구를 정한다 (새학기 때마다).' },
  { n: 11, c: '복장', t: '학생회 임원은 일반 학생과 다른 학교 배지를 착용한다.' },
  { n: 12, c: '학교생활', t: '벌점제 (세부 기준은 준비 중이에요)' }
];
function rulesView() {
  const cats = ['전체', '복장', '두발·외모', '동아리', '학교생활'];
  const list = RULES.filter(r => state.ruleCat === '전체' || r.c === state.ruleCat);
  return h('div', {},
    h('div', { class: 'page-head' }, h('h2', {}, '🏫 성운고등학교 교칙 📄'), h('p', {}, '항목을 눌러 원하는 규칙만 볼 수 있어요.')),
    h('div', { class: 'chips' }, cats.map(c => h('button', { class: 'chip', 'aria-pressed': String(state.ruleCat === c), onclick: () => { state.ruleCat = c; render(); } }, c))),
    h('ul', { class: 'rules' }, list.map(r =>
      h('li', { class: 'rule' }, h('span', { class: 'no' }, '규칙 ' + r.n), h('div', {}, h('span', { class: 'cat' }, r.c), h('p', {}, r.t))))));
}

function senderPicker(u, obj, name) {
  const opt = (val, title, sub) => h('label', { class: 'pick' },
    h('input', { type: 'radio', name, value: val, checked: obj.mode === val, onchange: () => { obj.mode = val; } }),
    h('span', {}, h('b', {}, title), h('small', {}, sub)));
  return h('div', { class: 'picks', role: 'radiogroup', 'aria-label': '보내는 사람' },
    opt('anon', '익명', '이름 없이 보내요'),
    opt('named', u.staff ? '교직원 이름' : '학번·이름', u.nick));
}

function composer(board) {
  const u = state.user;
  if (!state.composing[board]) {
    return h('button', { class: 'btn primary wide', style: 'margin-top:12px', onclick: () => {
      if (!u) return openAuth('login');
      state.composing[board] = true; render(); setTimeout(() => { const t = $('#composeText'); if (t) t.focus(); });
    } }, '✉️ 메시지 쓰기');
  }
  const d = state.draft[board] || (state.draft[board] = { to: '', text: '', mode: 'anon' });
  return h('div', { class: 'composer' },
    h('label', { class: 'field', style: 'margin-top:0' }, h('span', {}, '받는 사람 (비워두면 “모두에게”)'),
      h('input', { class: 'in', maxlength: 20, value: d.to, placeholder: board === 'staff' ? '예: 교무부 선생님' : '예: 2학년 3반 친구', oninput: e => d.to = e.target.value })),
    h('label', { class: 'field' }, h('span', {}, '전하고 싶은 말'),
      h('textarea', { class: 'in', id: 'composeText', maxlength: 300, placeholder: '300자까지 쓸 수 있어요', oninput: e => d.text = e.target.value }, d.text)),
    h('div', { class: 'field' }, h('span', {}, '보내는 사람'), senderPicker(u, d, 'mode-' + board)),
    h('p', { class: 'err', id: 'composeErr', role: 'alert' }),
    h('div', { class: 'row-end' },
      h('button', { class: 'btn soft', onclick: () => { state.composing[board] = false; render(); } }, '취소'),
      h('button', { class: 'btn primary', onclick: async ev => {
        if (!d.text.trim()) { $('#composeErr').textContent = '내용을 적어 주세요.'; return; }
        const btn = ev.currentTarget; btn.disabled = true;
        try {
          await api('POST', '/api/posts', { board, to: d.to, text: d.text, mode: d.mode });
          state.draft[board] = null; state.composing[board] = false;
          toast(d.mode === 'anon' ? '익명으로 전달했어요' : '메시지를 전달했어요');
          await loadPosts(board, false);
        } catch (e) { btn.disabled = false; handleErr(e); }
      } }, '전해주세요')));
}

function letter(board, p) {
  const u = state.user, open = !!state.open[p.id];
  const tint = 'c' + ([...p.id].reduce((a, c) => a + c.charCodeAt(0), 0) % 3);
  const from = p.mode === 'anon' ? '익명' : p.name;
  const el = h('article', { class: 'letter ' + tint },
    h('div', { class: 'to' }, 'To. ' + p.to),
    h('p', { class: 'body' }, p.text),
    h('div', { class: 'meta' },
      h('span', {}, 'From. ', h('span', { class: 'from' }, from)),
      h('span', {}, ago(p.ts)),
      h('span', { class: 'sp' }),
      p.mine ? (state.delAsk === p.id
        ? h('button', { class: 'link', onclick: async () => {
            try { await api('DELETE', `/api/posts/${p.id}?board=${board}`); state.delAsk = null; toast('삭제했어요'); await loadPosts(board, false); }
            catch (e) { state.delAsk = null; handleErr(e); render(); }
          } }, '정말 삭제할까요?')
        : h('button', { class: 'link', onclick: () => { state.delAsk = p.id; render(); } }, '삭제')) : null,
      h('button', { class: 'link', 'aria-expanded': String(open), onclick: () => { state.open[p.id] = !open; render(); } }, `답장 ${p.replies.length}${open ? ' 접기' : ''}`)));
  if (open) {
    const box = h('div', { class: 'replies' });
    p.replies.forEach(r => box.append(h('div', { class: 'bubble' },
      h('p', { class: 'body' }, r.text),
      h('div', { class: 'meta' }, h('span', { class: 'from' }, r.mode === 'anon' ? '익명' : r.name), h('span', {}, ago(r.ts))))));
    if (!p.replies.length) box.append(h('p', { class: 'hint', style: 'margin:0 0 8px' }, '아직 답장이 없어요. 첫 답장을 남겨 보세요.'));
    if (!u) {
      box.append(h('button', { class: 'btn soft small', onclick: () => openAuth('login') }, '로그인하고 답장하기'));
    } else {
      const d = state.rdraft[p.id] || (state.rdraft[p.id] = { text: '', mode: 'anon' });
      box.append(h('div', { class: 'reply-form' },
        h('textarea', { class: 'in', maxlength: 200, 'aria-label': '답장 내용', placeholder: '답장을 적어 주세요', oninput: e => d.text = e.target.value }, d.text),
        senderPicker(u, d, 'rmode-' + p.id),
        h('div', { class: 'row-end', style: 'margin-top:0' },
          h('button', { class: 'btn primary small', onclick: async ev => {
            if (!d.text.trim()) return toast('답장 내용을 적어 주세요');
            const btn = ev.currentTarget; btn.disabled = true;
            try {
              await api('POST', `/api/posts/${p.id}/replies`, { board, text: d.text, mode: d.mode });
              state.rdraft[p.id] = null; toast('답장을 보냈어요'); await loadPosts(board, false);
            } catch (e) { btn.disabled = false; handleErr(e); }
          } }, '답장 보내기'))));
    }
    el.append(box);
  }
  return el;
}

function boardBody(board) {
  const posts = state.posts[board], n = state.shown[board];
  const wrap = h('div', {}, composer(board));
  if (state.loadErr && !posts) {
    wrap.append(h('div', { class: 'card gate', style: 'margin-top:12px' }, h('p', {}, state.loadErr),
      h('button', { class: 'btn primary', onclick: () => { state.loadErr = null; render(); loadPosts(board, false); } }, '다시 불러오기')));
    return wrap;
  }
  if (!posts) { wrap.append(h('p', { class: 'empty' }, '메시지를 불러오는 중이에요…')); return wrap; }
  if (!posts.length) wrap.append(h('p', { class: 'empty' }, '아직 메시지가 없어요. 첫 메시지를 남겨 보세요.'));
  posts.slice(0, n).forEach(p => wrap.append(letter(board, p)));
  if (posts.length > n) wrap.append(h('button', { class: 'btn soft more', onclick: () => { state.shown[board] += 5; render(); } }, '더 보기'));
  return wrap;
}

function msgView() {
  const u = state.user;
  const pick = b => { state.board = b; render(); loadPosts(b, false); };
  const seg = h('div', { class: 'seg', role: 'tablist' },
    h('button', { class: 'seg-b', role: 'tab', 'aria-selected': String(state.board === 'student'), onclick: () => pick('student') }, '학생 게시판'),
    h('button', { class: 'seg-b', role: 'tab', 'aria-selected': String(state.board === 'staff'), onclick: () => pick('staff') }, '🔒 교직원 전용'));
  const view = h('div', {}, h('div', { class: 'page-head' }, h('h2', {}, '대신전해드립니다'),
    h('p', {}, '하고 싶은 말을 익명 또는 학번·이름으로 전해 보세요.')), seg);
  if (state.board === 'staff' && !(u && u.staff)) {
    view.append(h('div', { class: 'card gate', style: 'margin-top:12px' },
      h('div', { class: 'lock', 'aria-hidden': 'true' }, '🔒'),
      h('h3', {}, '교직원 전용 게시판이에요'),
      u ? h('p', {}, '학생 계정으로는 들어갈 수 없어요. 교직원 계정은 학번 칸에 “교직원”이라고 적어 가입해요.')
        : h('p', {}, '로그인이 필요해요. 교직원은 학번 칸에 “교직원”이라고 적어 주세요.'),
      u ? null : h('button', { class: 'btn primary', onclick: () => openAuth('login') }, '로그인')));
  } else {
    view.append(boardBody(state.board));
  }
  return view;
}

function render() {
  renderHeader();
  const main = $('#main');
  main.replaceChildren(state.view === 'home' ? homeView() : state.view === 'msg' ? msgView() : rulesView());
}

/* ---------- auth ---------- */
const dlg = $('#authDlg');
function setMode(m) {
  $('#loginPane').hidden = m !== 'login'; $('#signupPane').hidden = m !== 'signup';
  $('#tabLogin').setAttribute('aria-selected', String(m === 'login'));
  $('#tabSignup').setAttribute('aria-selected', String(m === 'signup'));
  $('#liErr').textContent = ''; $('#suErr').textContent = '';
}
function openAuth(m) {
  setMode(m);
  if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  setTimeout(() => $(m === 'login' ? '#li-id' : '#su-id').focus(), 30);
}
function closeAuth() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
async function logout() {
  try { await api('POST', '/api/logout'); } catch (e) {}
  forgetSession(); toast('로그아웃했어요'); render();
}
async function afterAuth(d, msg) {
  setToken(d.token); state.user = d.user; state.posts.staff = undefined;
  closeAuth(); toast(msg); render(); refresh(false);
}
const validId = id => id === '교직원' || /^\d{4}$/.test(id);
const validName = n => /^[가-힣a-zA-Z]{2,10}$/.test(n);

$('#tabLogin').onclick = () => setMode('login');
$('#tabSignup').onclick = () => setMode('signup');
$('#authClose').onclick = closeAuth;
dlg.addEventListener('click', e => { if (e.target === dlg) closeAuth(); });
function updateSignupHints() {
  const a = $('#su-id').value.trim(), b = $('#su-name').value.trim();
  $('#nickPrev').textContent = a && b ? a + b : '학번과 이름을 적어 주세요';
  $('#codeField').hidden = !(a === '교직원' && state.config.staffCodeRequired);
}
['su-id', 'su-name'].forEach(id => $('#' + id).addEventListener('input', updateSignupHints));

$('#doSignup').onclick = async ev => {
  const id = $('#su-id').value.trim(), name = $('#su-name').value.trim(), pw = $('#su-pw').value, pw2 = $('#su-pw2').value, err = $('#suErr');
  if (!validId(id)) return err.textContent = '학번은 숫자 4자리(예: 1109)로 적어 주세요. 교직원은 “교직원”이라고 적어요.';
  if (!validName(name)) return err.textContent = '이름은 한글 또는 영문 2~10자로 적어 주세요.';
  if (pw.length < 4) return err.textContent = '비밀번호는 4자 이상이어야 해요.';
  if (pw !== pw2) return err.textContent = '비밀번호가 서로 달라요. 다시 확인해 주세요.';
  err.textContent = ''; const btn = ev.currentTarget; btn.disabled = true;
  try {
    const d = await api('POST', '/api/signup', { id, name, pw, code: $('#su-code').value });
    ['su-id', 'su-name', 'su-pw', 'su-pw2', 'su-code'].forEach(i => $('#' + i).value = ''); updateSignupHints();
    await afterAuth(d, d.user.nick + ' 님, 환영해요!');
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false;
};
$('#doLogin').onclick = async ev => {
  const id = $('#li-id').value.trim(), name = $('#li-name').value.trim(), pw = $('#li-pw').value, err = $('#liErr');
  if (!id || !name || !pw) return err.textContent = '학번, 이름, 비밀번호를 모두 적어 주세요.';
  err.textContent = ''; const btn = ev.currentTarget; btn.disabled = true;
  try {
    const d = await api('POST', '/api/login', { id, name, pw });
    ['li-id', 'li-name', 'li-pw'].forEach(i => $('#' + i).value = '');
    await afterAuth(d, d.user.nick + ' 님, 어서 오세요!');
  } catch (e) { err.textContent = e.message; }
  btn.disabled = false;
};
dlg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') (e.target.id.startsWith('li-') ? $('#doLogin') : $('#doSignup')).click();
});

/* ---------- boot ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => go(t.dataset.view)));
$('#brand').addEventListener('click', () => go('home'));
setInterval(() => { if (!document.hidden) refresh(true); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(true); });
(async () => {
  try { state.config = await api('GET', '/api/config'); } catch (e) {}
  if (getToken()) {
    try { state.user = (await api('GET', '/api/me')).user; }
    catch (e) { if (e.status === 401) setToken(null); }
  }
  render(); refresh(false);
})();
</script>
</body>
</html>
